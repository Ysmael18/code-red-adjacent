<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Code-Red Adjacent</title>
<style>
:root{--bg:#ecebe9;--card:#fff;--tx:#1c1917;--mu:#78716c;--bd:#e0dedb;--in:#faf9f8;--th:#b91c1c;--ok:#15803d;--bad:#dc2626;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#121110;--card:#1e1b1a;--tx:#f5f4f2;--mu:#a8a29e;--bd:#38332f;--in:#2a2523;color-scheme:dark}}
body[data-role=rec]{--th:#b4540a}body[data-role=nurse]{--th:#1d4ed8}body[data-role=doc]{--th:#0f766e}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{font:14px/1.4 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--tx);display:flex;justify-content:center;--page:color-mix(in srgb,var(--th) 6%,var(--bg))}
#app{width:100%;max-width:420px;height:100dvh;background:var(--page);position:relative;overflow:hidden}
@media(min-width:500px){body{align-items:center}#app{height:min(844px,96vh);border-radius:28px;border:1px solid var(--bd);box-shadow:0 20px 50px rgba(0,0,0,.18)}}
#view{display:flex;flex-direction:column;height:100%}
.hd{background:var(--th);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:calc(14px + env(safe-area-inset-top,0px)) 14px 14px}
.hd h1{font-size:15px;margin:0;font-weight:700}
.sp{width:30px}
.ib{background:#fff;color:var(--th);border:0;border-radius:50%;width:30px;height:30px;display:grid;place-items:center;position:relative;cursor:pointer}
.ib i{position:absolute;top:3px;right:3px;width:7px;height:7px;background:#ef4444;border-radius:50%}
.lo{background:rgba(255,255,255,.22);color:#fff;border:0;border-radius:8px;padding:4px 9px;font-size:10px;display:grid;justify-items:center;cursor:pointer}
.lo svg{width:14px;height:14px}
.main{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.main.au{justify-content:center}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;box-shadow:0 2px 8px rgba(0,0,0,.05)}
.card h2{font-size:15px;margin:0 0 2px}
.lbl{display:block;font-size:11px;font-weight:600;margin:10px 0 4px}
input,select{width:100%;border:1px solid var(--bd);background:var(--in);color:var(--tx);border-radius:10px;padding:10px 12px;font:inherit}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--th);outline-offset:1px}
.btn{width:100%;background:var(--th);color:#fff;border:0;border-radius:10px;padding:11px;font:inherit;font-weight:600;cursor:pointer}
.btn.g{background:#15803d}.btn.s{background:#3b4452}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip,.pr{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:99px;padding:4px 11px;font:inherit;font-size:11px;cursor:pointer}
.chip.on{background:var(--th);color:#fff;border-color:var(--th)}
.pr{font-weight:700;color:#fff;background:var(--c);border-color:var(--c);opacity:.55}.pr.on{opacity:1;box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--c)}
.lks{display:flex;justify-content:space-between;margin-top:12px}
.lk{background:none;border:0;color:var(--th);font:inherit;font-size:11px;font-weight:600;cursor:pointer;padding:0}
.otp{display:flex;gap:6px;justify-content:center;margin:12px 0}
.otp input{width:36px;height:40px;padding:0;text-align:center;font-size:16px;border-radius:8px}
.otp input.bad{border-color:var(--bad);color:var(--bad)}
.ov{position:absolute;inset:0;background:rgba(0,0,0,.62);display:grid;place-items:center;padding:18px;z-index:5}
.md{text-align:center;width:100%}
.badge{width:34px;height:34px;border-radius:50%;background:color-mix(in srgb,var(--th) 15%,var(--card));color:var(--th);display:grid;place-items:center;font-size:10px;font-weight:800;margin:0 auto 8px}
.er{color:var(--bad);font-size:11px;font-weight:600;margin:0 0 10px}
.mu{color:var(--mu)}.sm{font-size:11px}.c{text-align:center}.mt{margin:8px 0}
.pp{border-radius:99px;padding:2px 9px;font-weight:700;font-size:11px;color:var(--c);background:color-mix(in srgb,var(--c) 15%,var(--card))}
.tm{border-radius:8px;padding:2px 8px;font-size:10px;font-weight:600;color:var(--c,var(--mu));background:color-mix(in srgb,var(--c,#888) 14%,var(--card));white-space:nowrap}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.ghost{border:1px solid var(--bd);background:var(--in);border-radius:8px;padding:3px 9px;font:inherit;font-size:10px;color:var(--tx);cursor:pointer}
.pt{cursor:default}.pt .nm{font-weight:700;font-size:15px;margin-left:8px}.pt .sub{font-size:11px;color:var(--mu);margin-top:6px}
.hot{border-color:var(--th);box-shadow:0 0 0 1px var(--th)}
.nav{display:flex;border-top:1px solid var(--bd);background:var(--card);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav button{flex:1;background:none;border:0;border-bottom:2px solid transparent;color:var(--mu);padding:8px 0 6px;font:inherit;font-size:10px;display:grid;justify-items:center;gap:2px;cursor:pointer}
.nav .on{color:var(--th);border-bottom-color:var(--th)}
.nav svg{width:18px;height:18px}
.opt{display:flex;align-items:center;gap:10px;border:1px solid var(--bd);border-radius:12px;padding:10px;background:var(--card);cursor:pointer;width:100%;text-align:left;color:var(--tx);font:inherit}
.opt.on{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 9%,var(--card))}
.opt:disabled{opacity:.6;cursor:not-allowed}
.opt .rd{margin-left:auto;width:18px;height:18px;border-radius:50%;border:1px solid var(--bd);display:grid;place-items:center;color:#fff}
.opt.on .rd{background:var(--ok);border-color:var(--ok)}
.dot{width:12px;height:12px;border-radius:50%;background:var(--c);flex:none}
.ck{display:flex;gap:8px;align-items:center;padding:9px 10px;border-radius:8px;background:var(--in);border:1px solid var(--bd);cursor:pointer;font-size:12px;width:100%;color:var(--tx);font-family:inherit;text-align:left}
.ck b{width:16px;height:16px;border-radius:4px;border:1px solid var(--bd);display:grid;place-items:center;color:#fff;flex:none}
.ck.on b{background:#eab308;border-color:#eab308}.ck b svg{width:11px;height:11px}
.stat{text-align:center;padding:16px 8px}.stat b{font-size:24px;display:block}.stat span{font-size:11px;color:var(--mu)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.room{border:1.5px solid var(--bd);border-radius:12px;padding:10px;background:var(--card);cursor:default;text-align:left;font:inherit;color:var(--tx)}
.room.av{border-color:var(--ok);cursor:pointer}.room.sel{box-shadow:0 0 0 2px var(--ok)}
.room b{display:block;margin-top:6px}
.tag{font-size:10px;font-weight:700;color:#fff;border-radius:99px;padding:1px 8px;background:var(--c)}
.hd2{font-size:12px;font-weight:700;margin:6px 0 0}
.kv{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--bd);font-size:12px}.kv:last-child{border:0}.kv span{color:var(--mu)}.kv b{font-weight:700}
.toast{position:absolute;bottom:84px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:8px 14px;border-radius:99px;font-size:12px;opacity:0;transition:.2s;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1}
.big{font-size:20px;font-weight:800;margin:2px 0}
</style></head>
<body><div id="app"><div id="view"></div><div id="toast" class="toast"></div></div>
<script>
const $=id=>document.getElementById(id);
const IC={bell:'M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10.3 21a1.94 1.94 0 0 0 3.4 0',back:'m15 18-6-6 6-6',out:'M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9',reg:'M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8M19 8v6M22 11h-6',list:'M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01',users:'M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75',bed:'M2 4v16M2 8h18a2 2 0 0 1 2 2v10M2 17h20M6 8v9',rep:'m17 2 4 4-4 4M3 11v-1a4 4 0 0 1 4-4h14M7 22l-4-4 4-4M21 13v1a4 4 0 0 1-4 4H3',chart:'M3 3v16a2 2 0 0 0 2 2h16M18 17V9M13 17V5M8 17v-3',clip:'M8 2h8v4H8zM16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2',user:'M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2M12 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8',clock:'M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20M12 6v6l4 2',ok:'M20 6 9 17l-5-5'};
const ico=n=>`<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="${IC[n]}"/></svg>`;
const PC={1:'#dc2626',2:'#c2410c',3:'#a16207',4:'#15803d',5:'#1d4ed8'};
const pp=p=>`<span class="pp" style="--c:${PC[p]}">P${p}</span>`;
const tm=(t,c)=>`<span class="tm" ${c?`style="--c:${c}"`:''}>${t}</span>`;
const PT=[
{p:1,n:'Jackson, P.',c:'Chest pain',dx:'Angina',dr:'Ocampo, L.',nu:'Maria, P.',rm:'Room 01',t:'01:24',tc:'#dc2626'},
{p:2,n:'Cruz, A.',c:'High fever',dx:'Viral infection',dr:'Luis, A.',nu:'Panitan, S.',rm:'Room 02',t:'15:39',tc:'#b45309'},
{p:3,n:'Mapili, M.',c:'Sprain',dx:'Ankle sprain',dr:'Jimenez, B.',nu:'Morillo, J.',rm:'Room 03',t:'44:17',tc:'#b45309'},
{p:4,n:'Villas, J.',c:'Minor rash',dx:'Contact dermatitis',dr:'Griego, M.',nu:'Maria, P.',rm:'Room 04',t:'57:03',tc:'#15803d'}];
const S={scr:'login',role:null,lr:'rec',modal:0,code:'',err:0,sym:[1,1,1,1,1],pr:1,rs:5,rd:0,rn:0,sel:0,nb:1,da:0};
const HOME={rec:'register',nurse:'npat',doc:'dpat'};
const NAV={rec:[['register','Register','reg'],['queue','Queue','list'],['staff','Staff','users'],['rooms','Rooms','bed'],['reassign','Reassign','rep'],['summary','Summary','chart']],
nurse:[['npat','Patients','users'],['ntask','Task','clip'],['nstat','Status','user']],
doc:[['dpat','Patients','users'],['davail','Availability','clock']]};
const ALIAS={priority:'register',ddet:'dpat'};
const field=(l,ph,v='',t='text')=>`<label class="lbl">${l}</label><input type="${t}" placeholder="${ph}" value="${v}">`;
const bk=s=>`<button class="ib" aria-label="Back" onclick="go('${s}')">${ico('back')}</button>`;
const lo=`<button class="lo" onclick="out()">${ico('out')}Log out</button>`;
const boxes=()=>`<div class="otp">${[0,1,2,3,4,5].map(i=>`<input maxlength="1" inputmode="numeric" aria-label="Digit ${i+1}" class="${S.err?'bad':''}" value="${S.code[i]||''}" oninput="otp(${i},this)" onkeydown="otk(${i},event)">`).join('')}</div>`;
const modal=()=>`<div class="ov"><div class="card md"><div class="badge">2FA</div><h2>Two-Factor Authentication</h2><p class="mu sm">Enter the 6-digit code we sent to +63 9•• ••• 4567 to finish signing in.</p>${boxes()}${S.err?'<p class="er">Incorrect code. Please try again. 2 attempts left.</p>':''}<button class="btn" onclick="ver()">Verify</button><p class="mu sm mt">Resend code in 0:30</p><button class="lk" onclick="S.modal=0;render()">Cancel</button></div></div>`;
const radio=(on,dis,c,t,s,fn)=>`<button class="opt ${on?'on':''}" ${dis?'disabled':''} onclick="${fn}"><span class="dot" style="--c:${c}"></span><span>${t}${s?`<div class="mu sm">${s}</div>`:''}</span><span class="rd">${on?ico('ok').replace('width="20" height="20"','width="12" height="12"'):''}</span></button>`;
const NOTIF={
rec:[['Patient priority set','NOW','P1 Patient P. Jackson queued',1],['Patient queue update','2m','Patient A. Cruz moved to Room 02'],['Staff availability','9m','Dr. Alexander is Free'],['Room availability','14m','Room 5 and Room 6 are Available']],
nurse:[['Patient re-check overdue','NOW','P1 Patient P. Jackson · Room 01',1],['Patient emergency vitals','1:00','Patient P. Jackson · Room 01'],['Patient re-check due later','15:00','Patient J. Villas · Room 04'],['Patient infection check','10:00','Patient J. Villas · Room 04']],
doc:[['New patient assigned','NOW','P1 Patient P. Jackson · Room 1 · Chest pain',1],['Review patient','P2','Patient A. Cruz · Room 2 · High fever'],['Review patient','P3','Patient M. Mapili · Room 3 · Sprain'],['Review patient','P4','Patient J. Villas · Room 4 · Minor rash']]};
const ptCard=(x,go2,extra='')=>`<div class="card pt" ${go2?`style="cursor:pointer" onclick="${go2}"`:''}><div class="row"><span>${pp(x.p)}<span class="nm">${x.n}</span></span>${extra}</div></div>`;

const V={
login:()=>({t:'Sign In',h:`<div class="card"><div class="lbl" style="margin-top:0">I am a</div><div class="chips">${[['rec','Receptionist'],['nurse','Nurse'],['doc','Doctor']].map(([k,l])=>`<button class="chip ${S.lr==k?'on':''}" onclick="S.lr='${k}';render()">${l}</button>`).join('')}</div>${field('Staff ID','Staff ID','RC-1042')}${field('Password','Password','password','password')}<div style="height:14px"></div><button class="btn" onclick="S.modal=1;S.code='';S.err=0;render()">Sign In</button><div class="lks"><button class="lk" onclick="go('change')">Forgot password?</button><button class="lk" onclick="go('create')">Create account</button></div></div>`,au:1}),
change:()=>({t:'Change Password',l:bk('login'),au:1,h:`<div class="card"><h2>Set New Password</h2>${field('New Password','New password','password','password')}${field('Confirm Password','Confirm password','password','password')}<div style="height:14px"></div><button class="btn" onclick="toast('Password updated');go('login')">Confirm</button></div>`}),
create:()=>({t:'Create Account',l:bk('login'),h:`<div class="card"><h2>Create your Account</h2><p class="mu sm" style="margin:0">Enter your details to create a secure account for hospital access.</p>${field('Full Name','Full name','Ana Reyes')}${field('Staff ID','Staff ID','RC-1041')}<label class="lbl">Role</label><select><option>Receptionist</option><option selected>Nurse</option><option>Doctor</option></select>${field('Password','Password','password','password')}${field('Hospital Code','Hospital code','12345678','password')}${field('Mobile Number (for 2FA)','+63 9XX XXX XXXX')}<div style="height:16px"></div><button class="btn" onclick="S.code='';S.err=0;go('verify')">Create</button></div>`}),
verify:()=>({t:'Verify Your Number',au:1,h:`<div class="card c"><h2>Confirm your mobile number</h2><p class="mu sm">Your account was created. Enter the 6-digit code we sent to +63 9•• ••• 4567 so we can use it for two-factor sign-in.</p>${boxes()}<button class="btn" onclick="S.code='';go('login')">Verify and finish</button><p class="mu sm mt">Resend code in 0:30</p><button class="lk" onclick="go('create')">Change number</button></div>`}),

register:()=>({t:'Register Patient',l:lo,bell:1,nav:1,au:1,h:`<div class="card">${field('Full name','Enter patient name')}${field('Age','Enter age')}${field('Complaint','Enter complaint')}<div style="height:14px"></div><button class="btn" onclick="go('priority')">Next: Set Priority</button></div>`}),
priority:()=>({t:'Set Priority',bell:1,nav:1,h:`<div class="card"><h2>Triage checklist</h2><p class="mu sm" style="margin:0 0 8px">Review symptoms before assigning a priority level.</p><div style="display:grid;gap:6px">${['Chest pain or pressure','Severe headache','Shortness of breath','Severe abdominal pain','Sudden weakness or numbness'].map((s,i)=>`<button class="ck ${S.sym[i]?'on':''}" onclick="S.sym[${i}]^=1;render()"><b>${S.sym[i]?ico('ok'):''}</b>${s}</button>`).join('')}<button class="ck" onclick="toast('Add symptom (demo)')">+ Add symptom</button></div><div class="lbl">Priority decision</div><div class="chips">${[1,2,3,4,5].map(p=>`<button class="pr ${S.pr==p?'on':''}" style="--c:${PC[p]}" onclick="S.pr=${p};render()">P${p}</button>`).join('')}</div><div style="height:14px"></div><button class="btn" onclick="toast('Patient queued as P${S.pr}');go('queue')">Confirm and queue</button></div>`}),
queue:()=>({t:'Patient Queue',l:bk('register'),bell:1,nav:1,h:PT.map(x=>`<div class="card pt"><div class="row"><span>${pp(x.p)}<span class="nm">${x.n}</span></span><button class="ghost" onclick="go('reassign')">Reassign</button></div><div class="row sub"><span>Doctor: ${x.dr}<br>Nurse: ${x.nu}</span><span style="display:flex;gap:6px">${tm(x.rm)}${tm(x.t,x.tc)}</span></div></div>`).join('')}),
staff:()=>({t:'Staff Availability',l:bk('queue'),bell:1,nav:1,h:`<p class="mu sm" style="margin:0">View only · Staff are assigned automatically.</p>${[['Doctors',[['Dr. Alexander','Emergency Physician',1],['Dr. Ocampo','Internal Medicine',0]]],['Nurses',[['Nurse Marces','Triage Nurse',1],['Nurse Panitan','Staff Nurse',0]]]].map(([g,l])=>`<div class="hd2">${g}</div>${l.map(([n,r,f])=>`<div class="card row" style="padding:10px"><span class="row" style="justify-content:flex-start;gap:10px"><span class="dot" style="--c:${f?'#15803d':'#dc2626'};width:26px;height:26px;display:grid;place-items:center;color:#fff">${ico(f?'ok':'clock').replace('width="20" height="20"','width="14" height="14"')}</span><span><b>${n}</b><div class="mu sm">${r}</div></span></span>${tm(f?'Free':'Busy',f?'#15803d':'#dc2626')}</div>`).join('')}`).join('')}`}),
rooms:()=>({t:'Room Availability',l:bk('queue'),bell:1,nav:1,h:`<div class="grid">${[1,2,3,4].map(i=>`<div class="room"><div class="row"><span class="tag" style="--c:#dc2626">0${i}</span><span class="tag" style="--c:#dc2626">Occupied</span></div><b>Room ${i}</b><span class="mu sm">${PT[i-1].n}</span></div>`).join('')}${[5,6].map(i=>`<button class="room av ${S.rs==i?'sel':''}" onclick="S.rs=${i};render()"><div class="row"><span class="tag" style="--c:#15803d">0${i}</span><span class="tag" style="--c:#15803d">Available</span></div><b>Room ${i}</b><span class="mu sm">Ready for admission</span></button>`).join('')}</div><div class="two"><button class="btn g" onclick="toast('Assigned to Room ${S.rs}')">Assign</button><button class="btn s" onclick="toast('Move patient (demo)')">Move</button></div>`}),
reassign:()=>({t:'Reassign Patient',l:bk('queue'),bell:1,nav:1,h:`<div class="card">${pp(4)} <b style="margin-left:6px;font-size:15px">Villas, J.</b><div class="mu sm mt">Current staff<br>Dr. Griego, M. · Nurse Maria P.</div></div><div class="hd2">Choose doctor</div>${radio(S.rd==0,0,'#15803d','Dr. Alexander (0 patients)','','S.rd=0;render()')}${radio(0,1,'#dc2626','Dr. Ocampo (Busy)','','')}<div class="hd2">Choose nurse</div>${radio(S.rn==0,0,'#15803d','Nurse Marces (0 patients)','','S.rn=0;render()')}${radio(0,1,'#dc2626','Nurse Panitan (Busy)','','')}<button class="btn" onclick="toast('Patient reassigned');go('queue')">Confirm reassignment</button>`}),
summary:()=>({t:'Shift Summary',l:bk('queue'),bell:1,nav:1,h:`<div class="grid">${[['48','Patients'],['23m','Avg wait'],['9','Admitted'],['31','Discharge']].map(([a,b])=>`<div class="card stat"><b>${a}</b><span>${b}</span></div>`).join('')}</div><div class="card c" style="padding:10px;font-weight:600;font-size:12px">Shift: 6:00 AM - 2:00 PM</div><button class="btn" onclick="toast('Summary exported (demo)')">Export Summary</button>`}),

npat:()=>({t:'Assigned Patients',l:lo,bell:1,nav:1,h:`${[PT[0],PT[3]].map(x=>`<div class="card pt"><div class="row"><span>${pp(x.p)}<span class="nm">${x.n}</span></span></div><div class="row sub"><span>${x.c}</span><span style="display:flex;gap:6px">${tm(x.rm)}${tm(x.t,x.tc)}</span></div></div>`).join('')}<div class="card row" style="padding:10px;font-size:12px"><span class="row" style="gap:8px"><span class="dot" style="--c:#dc2626"></span>Status: ${S.nb?'Busy with 2 patients':'Available'}</span></div>`}),
ntask:()=>({t:'My Tasks',l:bk('npat'),bell:1,nav:1,h:`<div class="card"><div class="mu sm">WORKFLOW</div><div class="big">Rechecks &amp; next tasks</div><div class="hd2">Re-checks</div><div style="display:grid;gap:8px;margin-top:6px">${[[1,'Re-check P. Jackson','now overdue by 1:00'],[4,'Re-check J. Villas','due in 15:00']].map(([p,a,b])=>`<div class="card" style="padding:9px;display:flex;gap:8px;align-items:center">${pp(p)}<span style="font-size:12px"><b>${a}</b><br><span class="mu sm">${b}</span></span></div>`).join('')}</div><div class="hd2" style="margin-top:12px">Upcoming Tasks:</div><div style="display:grid;gap:8px;margin-top:6px">${[['Emergency vital check','P. Jackson · Room 01','01:00'],['Infection check','J. Villas · Room 04','10:00']].map(([a,b,t])=>`<div class="card row" style="padding:9px"><span style="font-size:12px"><b>${a}</b><br><span class="mu sm">${b}</span></span>${tm(t,'#15803d')}</div>`).join('')}</div></div>`}),
nstat:()=>({t:'My Status',l:bk('npat'),bell:1,nav:1,h:`<div class="card row"><span><span class="mu sm">CURRENT STATUS</span><div class="big">${S.nb?'Busy':'Available'}</div></span>${tm(S.nb?'● Busy':'● Ready now',S.nb?'#dc2626':'#15803d')}</div><p class="mu sm" style="margin:-4px 2px">${S.nb?'You are currently busy and assigned to 2 patients':'You are ready for the next patient.'}</p><button class="btn" onclick="S.nb^=1;render()">${S.nb?'Done, mark me available':'Mark me busy'}</button><p class="mu sm c">The system will assign your next patient once you are available</p>`}),

dpat:()=>({t:'Assigned Patients',l:lo,bell:1,nav:1,h:PT.map((x,i)=>`<div class="card pt" style="cursor:pointer" onclick="S.sel=${i};go('ddet')"><div class="row"><span>${pp(x.p)}<span class="nm">${x.n}</span></span></div><div class="row sub"><span>${x.c}</span><span style="display:flex;gap:6px">${tm(x.rm)}${tm(x.t,x.tc)}</span></div></div>`).join('')}),
ddet:()=>{const x=PT[S.sel];return{t:'Patient Detail',l:bk('dpat'),bell:1,nav:1,h:`<div class="card"><div class="row" style="justify-content:flex-start;gap:8px;padding-bottom:8px;border-bottom:1px solid var(--bd)">${pp(x.p)}<b style="font-size:15px">${x.n}</b></div>${[['Complaint',x.c],['Diagnosis',x.dx],['Wait time',x.t],['Room',x.rm.replace('0','')],['Doctor','Dr. Alexander'],['Nurse',x.nu]].map(([a,b])=>`<div class="kv"><span>${a}</span><b>${b}</b></div>`).join('')}</div><button class="btn" onclick="toast('Marked as seen')">Mark as seen</button><div class="two"><button class="btn g" onclick="toast('Patient admitted')">Admit</button><button class="btn s" onclick="toast('Patient discharged')">Discharge</button></div>`}},
davail:()=>({t:'My Availability',l:bk('dpat'),bell:1,nav:1,h:`<div class="card"><div class="row"><span><span class="mu sm">CURRENT STATUS</span><div class="big">${['Available','Busy','Off-duty'][S.da]}</div></span>${tm(['● Ready now','● Treating','● Off'][S.da],['#15803d','#dc2626','#6b7280'][S.da])}</div></div><div class="hd2" style="font-size:15px">Choose status</div><p class="mu sm" style="margin:0">Select the state that best matches your current workflow.</p>${[['Available','Ready for the next patient','#16a34a'],['Busy','Treating a patient','#dc2626'],['Off-duty','No assignment','#6b7280']].map(([a,b,c],i)=>radio(S.da==i,0,c,a,b,`S.da=${i};render()`)).join('')}`}),
notif:()=>({t:'Notifications',l:bk(HOME[S.role]),nav:1,h:NOTIF[S.role].map(([a,b,c,h])=>`<div class="card ${h?'hot':''}" style="padding:11px"><div class="row"><b>${a}</b>${tm(b,h?'':'#c2410c')}</div><div class="mu sm mt" style="margin-bottom:0">${c}</div></div>`).join('')})
};

function render(){
 const v=V[S.scr]();
 document.body.dataset.role=S.role||'';
 const nav=v.nav&&S.role?`<div class="nav">${NAV[S.role].map(([k,l,i])=>`<button class="${S.scr==k||ALIAS[S.scr]==k?'on':''}" onclick="go('${k}')">${ico(i)}${l}</button>`).join('')}</div>`:'';
 $('view').innerHTML=`<div class="hd">${v.l||'<span class="sp"></span>'}<h1>${v.t}</h1>${v.bell?`<button class="ib" aria-label="Notifications" onclick="go('notif')">${ico('bell')}<i></i></button>`:'<span class="sp"></span>'}</div><div class="main ${v.au?'au':''}">${v.h}</div>${nav}${S.modal?modal():''}`;
 const f=document.querySelector('.otp input');if(f&&!S.code)f.focus();
}
function go(s){S.scr=s;render()}
function out(){S.role=null;S.scr='login';render()}
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),1800)}
function otp(i,el){el.value=el.value.replace(/\D/g,'');const a=[...document.querySelectorAll('.otp input')];S.code=a.map(x=>x.value).join('');S.err=0;a.forEach(x=>x.classList.remove('bad'));const e=document.querySelector('.er');if(e)e.remove();if(el.value&&a[i+1])a[i+1].focus()}
function otk(i,e){if(e.key==='Backspace'&&!e.target.value&&i>0)document.querySelectorAll('.otp input')[i-1].focus()}
function ver(){if(S.code==='000000'){S.err=1;render();return}S.modal=0;S.role=S.lr;S.code='';go(HOME[S.role])}
render();
</script></body></html>
